name: Deploy Muse website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web files if missing
        run: |
          if [ ! -d web ]; then
            cp lib/main.dart /tmp/main.dart
            cp pubspec.yaml /tmp/pubspec.yaml
            flutter create --project-name muse --platforms=web .
            cp /tmp/main.dart lib/main.dart
            cp /tmp/pubspec.yaml pubspec.yaml
          fi

      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
